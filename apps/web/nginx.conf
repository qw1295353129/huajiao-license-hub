server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 基础安全响应头（location 内若出现任一 add_header，须整组重声明，否则丢失）
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
  # HSTS 仅在 HTTPS 下有意义；当前只 listen 80，启用 TLS 后再加 Strict-Transport-Security

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  client_max_body_size 8m;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # 后端接口：客户端 SDK 与前端共用同一入口，避免跨域
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆盖而非追加：只信任本层对端地址，防止客户端伪造链路
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # 激活/校验接口不要缓存
    proxy_buffering off;
  }

  # 带 hash 的静态资源长缓存（含 add_header，须重声明安全头）
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
  }

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
